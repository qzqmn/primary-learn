name: Release

# 與 ci.yml 的分工（修復 v*.*.* tag 重複發版）：
#   - ci.yml：push 到 main 或 v*.*.* tag 時跑完整 test → docker → publish，
#     由 publish job 產生 :latest、:sha-xxxxxxx，以及版本 tag 的 :1.2.3、:1.2。
#   - 本檔原本也監聽 push tags，同一個 tag 會同時觸發兩條工作流程、
#     重複建置並推送同一批鏡像。改為只保留 workflow_dispatch，供需要手動補發／
#     重建鏡像時使用；ci.yml 的測試與發佈邏輯完全不動。
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
