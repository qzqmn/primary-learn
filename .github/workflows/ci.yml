name: CI

# push 到 main：測試通過後自動把鏡像發佈到 GHCR（:latest 與 :sha-xxxxxxx）。
# 推送版本標籤（v1.2.3）：同樣發佈，並多加 :1.2.3、:1.2 標籤。
# Pull request：只跑測試，不發佈。
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: 型別檢查、單元測試、建置、端到端煙霧測試
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: 端到端煙霧測試（真實 HTTP：設定精靈 → 班級 → 練習 → 報告 → 權限隔離 → 備份還原）
        run: npm run smoke

  docker:
    name: Docker 鏡像建置並跑煙霧測試
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: 建置鏡像
        run: docker build -f docker/Dockerfile -t hkpl:ci .
      - name: 啟動容器
        run: |
          mkdir -p smoke-data
          docker run -d --name hkpl --user "$(id -u):$(id -g)" -p 3000:3000 \
            -v "$PWD/smoke-data:/data" -e SETUP_TOKEN=CI-SMOKE hkpl:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/api/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/api/healthz
      - name: 對容器跑煙霧測試
        working-directory: apps/web
        run: |
          npm ci
          BASE_URL=http://127.0.0.1:3000 SETUP_TOKEN=CI-SMOKE DATA_DIR="$GITHUB_WORKSPACE/smoke-data" node scripts/smoke.mjs
      - name: 容器內維護工具可用
        run: |
          docker exec hkpl cli list-admins | grep boss
          docker inspect --format '{{.State.Health.Status}}' hkpl
      - name: 容器日誌
        if: always()
        run: docker logs hkpl | tail -50

  publish:
    name: 發佈多架構鏡像到 GHCR
    runs-on: ubuntu-latest
    needs: [test, docker]
    # 只在 push 到 main、版本標籤、或手動觸發時發佈；pull request（包括來自 fork 的）不會發佈
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: 鏡像名稱（GHCR 要求全小寫）
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 發佈結果
        run: |
          {
            echo "### 已發佈鏡像"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "VPS 上：\`docker compose pull && docker compose up -d\`"
          } >> "$GITHUB_STEP_SUMMARY"
