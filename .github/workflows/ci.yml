name: CI

# push 到 main：測試通過後自動把鏡像發佈到 GHCR（:latest 與 :sha-xxxxxxx）。
# 推送版本標籤（v1.2.3）：同樣發佈，並多加 :1.2.3、:1.2 標籤。
# Pull request：只跑測試，不發佈。
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: 型別檢查、單元測試、建置、端到端煙霧測試
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: 端到端煙霧測試（真實 HTTP：設定精靈 → 班級 → 練習 → 報告 → 權限隔離 → 備份還原）
        run: npm run smoke

  docker:
    name: Docker 鏡像建置並跑煙霧測試
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: 建置鏡像
        run: docker build -f docker/Dockerfile -t hkpl:ci .
      - name: 啟動容器
        run: |
          mkdir -p smoke-data
          docker run -d --name hkpl --user "$(id -u):$(id -g)" -p 3000:3000 \
            -v "$PWD/smoke-data:/data" -e SETUP_TOKEN=CI-SMOKE hkpl:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/api/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/api/healthz
      - name: 對容器跑煙霧測試
        working-directory: apps/web
        run: |
          npm ci
          BASE_URL=http://127.0.0.1:3000 SETUP_TOKEN=CI-SMOKE DATA_DIR="$GITHUB_WORKSPACE/smoke-data" node scripts/smoke.mjs
      - name: 容器內維護工具可用
        run: |
          docker exec hkpl cli list-admins | grep boss
          docker inspect --format '{{.State.Health.Status}}' hkpl
      - name: 回歸測試：/data 屬於 root（NAS、管理面板、舊 volume 常見）仍能啟動，且程式降權運行
        run: |
          sudo mkdir -p root-data && sudo chown -R 0:0 root-data
          docker run -d --name hkpl-root -p 3001:3000 -v "$PWD/root-data:/data" \
            --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges:true hkpl:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3001/api/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:3001/api/healthz
          test "$(sudo stat -c '%u' root-data/app.db)" = "1000"
          docker exec hkpl-root cli list-admins
          # exec 預設是 root，cli 必須降權，不可在資料目錄留下 root 擁有的檔案
          test "$(sudo find root-data ! -uid 1000 | wc -l)" = "0"
      - name: 回歸測試：舊版 compose（cap_drop ALL、沒有 cap_add）仍能啟動（以 root 運行並給出警告）
        run: |
          sudo mkdir -p legacy-data && sudo chown -R 0:0 legacy-data
          docker run -d --name hkpl-legacy -p 3002:3000 -v "$PWD/legacy-data:/data" \
            --cap-drop ALL --security-opt no-new-privileges:true hkpl:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3002/api/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:3002/api/healthz
          docker logs hkpl-legacy 2>&1 | grep -q "沒有 SETUID"
      - name: 回歸測試：非 root 且 /data 不可寫 → 快速失敗並給出清楚訊息（不是啟動後每個請求都 500）
        run: |
          sudo mkdir -p ro-data && sudo chown -R 0:0 ro-data
          if out=$(docker run --rm --user 1000:1000 -v "$PWD/ro-data:/data" hkpl:ci 2>&1); then echo "應該要失敗"; exit 1; fi
          echo "$out" | grep -q "無法寫入"
      - name: 容器日誌
        if: always()
        run: |
          docker logs hkpl | tail -30
          docker logs hkpl-root 2>&1 | tail -30 || true

  publish:
    name: 發佈多架構鏡像到 GHCR
    runs-on: ubuntu-latest
    needs: [test, docker]
    # 只在 push 到 main、版本標籤、或手動觸發時發佈；pull request（包括來自 fork 的）不會發佈
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: 鏡像名稱（GHCR 要求全小寫）
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 發佈結果
        run: |
          {
            echo "### 已發佈鏡像"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "VPS 上：\`docker compose pull && docker compose up -d\`"
          } >> "$GITHUB_STEP_SUMMARY"
